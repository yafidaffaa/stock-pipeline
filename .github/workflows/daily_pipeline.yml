name: Daily Stock Pipeline

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Setiap hari kerja jam 17:00 WIB (10:00 UTC)
  workflow_dispatch:          # Bisa trigger manual juga

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily stock data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/generate_daily.py

      - name: Run dbt models
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
        run: |
          cd stock_dbt
          dbt run
          dbt test

      - name: Export to Google Sheets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: python scripts/export_to_sheets.py